plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}


android {
    namespace 'com.vehicle.information.trending.rtoexam.rto'

    compileSdk 36

    defaultConfig {
        applicationId "com.vehicle.information.trending.rtoexam.rto"
        minSdk 21
        targetSdk 36
        versionCode 14
        versionName "3.2"
        //3 1.2 // 4 1.3
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        dataBinding true
        buildConfig true
    }

}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
        }
    }

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation "androidx.constraintlayout:constraintlayout-core:1.0.4"



    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.airbnb.android:lottie:5.2.0'
    //shimmerfacebook
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
//
    implementation "androidx.lifecycle:lifecycle-process:2.5.1"
    implementation "androidx.lifecycle:lifecycle-runtime:2.5.1"
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:2.5.1"
//onesignal
    implementation 'com.onesignal:OneSignal:[4.0.0, 4.99.99]'
    //
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    implementation 'org.jsoup:jsoup:1.15.4'
//
    implementation 'com.google.firebase:firebase-database:20.0.4'
    implementation 'com.google.firebase:firebase-core:20.1.2'
    implementation 'com.google.firebase:firebase-messaging:23.0.3'
    implementation 'com.google.firebase:firebase-analytics:20.1.2'
    implementation 'com.google.firebase:firebase-crashlytics:18.2.9'
    //
    implementation 'com.google.ads.mediation:facebook:5.11.0.0'
//ads
    implementation 'com.google.android.gms:play-services-ads:22.0.0'
    implementation 'com.google.ads.mediation:facebook:6.14.0.0'
    implementation 'com.google.ads.mediation:applovin:11.7.1.0'

//
    implementation 'com.facebook.android:audience-network-sdk:6.15.0'
    implementation 'com.facebook.android:facebook-android-sdk:8.1.0'
//
    implementation 'com.applovin:applovin-sdk:11.8.1'
    implementation 'com.applovin.mediation:facebook-adapter:6.12.0.1'
    implementation 'com.applovin.mediation:google-adapter:21.3.0.2'
//material dialog
    implementation 'com.afollestad.material-dialogs:core:0.9.6.0'

//sdp
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
    //SpinKitView
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
    implementation 'com.mikhaellopez:circularfillableloaders:1.2.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.wang.avi:library:2.1.3'
    implementation 'joda-time:joda-time:2.1'
}